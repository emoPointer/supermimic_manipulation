[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "supermimic-manipulation"
version = "0.1.0"
description = "SuperMimic world-model policy optimization for robot manipulation on mjlab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mjlab==1.5.3",
  "numpy<2.5",
  "torch==2.9.1",
  "wandb>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.16"]

[project.entry-points."mjlab.tasks"]
clab = "clab.tasks.mjlab_plugin"

[project.scripts]
clab = "clab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clab"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
